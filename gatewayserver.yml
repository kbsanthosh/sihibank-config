server:
  port: 8072

spring:
  cloud:
    gateway:
      # FIXED: Added the missing discovery locator configurations to force route generation
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      # FIXED: Switched from 'localhost' to your actual Docker container bridge network name
      defaultZone: "http://eurekaserver-rest-api:8070/eureka/" 

